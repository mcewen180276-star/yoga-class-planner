function sunPage(){return `<div class="panel"><h3>Create your own Sun Salutation</h3><p class="small muted">Enter one pose per line, in teaching order. Include right/left movements explicitly.</p><label>Sequence name</label><input id="customSunName" placeholder="My gentle sun flow"><label>Class variation</label><select id="customSunType"><option value="chair">Chair</option><option value="gentle">Gentle</option><option value="vinyasa">Vinyasa</option><option value="wall">Wall</option><option value="traditional">Traditional</option></select><label>Pose steps (one per line)</label><textarea id="customSunSteps" rows="5" placeholder="Mountain pose\nArm raise\nForward fold"></textarea><button class="primary" onclick="saveCustomSun()">Save custom sequence</button></div><div class="panel"><h3>My custom sequences</h3>${state.customSuns.map(p=>`<details><summary>${esc(p.name)}</summary>${sunStepList(p,true)}${btn('Add to class',`addCustomSun('${p.id}')`,'primary')}${btn('Delete',`deleteCustomSun('${p.id}')`,'danger')}</details>`).join('')||'<p>No custom sequences yet.</p>'}</div><div class="panel"><h2>☀️ Sun salutation library</h2><p class="muted">${SUN_SALS.length} variations, including chair, wall, traditional, Vinyasa, Hatha, sport-focused and gentler adaptations. These are curated sequence outlines, not individually verified video demonstrations.</p>${SUN_SALS.map((a,i)=>{let p=sunPose(i);return `<details><summary>${esc(p.name)} <span class="tag">${esc(p.sunType)}</span></summary>${sunStepList(p,true)}<p><a href="${esc(p.link)}" target="_blank" rel="noopener">Find matching demonstration ↗</a></p><p class="small muted">${sunAllowed(p,draft.style)?'Compatible with selected class style.':'Change class style to add this sequence.'}</p>${sunAllowed(p,draft.style)?btn('Add to current class',`addSunDirect(${i})`,'primary'):''}</details>`}).join('')}</div>`}
function saveCustomSun(){let name=$('customSunName').value.trim(),steps=$('customSunSteps').value.split('\n').map(x=>x.trim()).filter(Boolean),type=$('customSunType').value;if(!name||steps.length<3)return toast('Enter a name and at least 3 steps');let p={id:'customsun'+Date.now(),name,category:type==='chair'?'chair':'standing',sunType:type,steps,equipment:type==='chair'?'chair':type==='wall'?'wall':'mat',link:'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' '+type+' yoga sun salutation'),minutes:6,instructions:steps.join(' → '),focus:['Full-body mobility'],level:'Beginner',modifications:'Adapt movements and transitions to participants.'};state.customSuns.push(p);save();render();toast('Custom sequence saved')}

function equipmentPanel(){return `<div class="panel"><h3>Equipment available</h3><p class="small muted">Choose equipment available for this class. Generator avoids exercises requiring unavailable props; a mat and floor are assumed available unless excluded.</p><div class="actions">${['chair','mat','wall','blocks','strap','bolster','blanket'].map(x=>`<label class="pill"><input type="checkbox" style="width:auto" ${equipmentSelected.includes(x)?'checked':''} onchange="toggleEquipment('${x}',this.checked)"> ${x}</label>`).join('')}</div><p class="small muted">Equipment matching is approximate; review each pose's requirements before teaching.</p></div>`}
function toggleEquipment(x,on){equipmentSelected=on?[...new Set([...equipmentSelected,x])]:equipmentSelected.filter(v=>v!==x)}
function equipmentCompatible(p){let e=String(p.equipment||'').toLowerCase();if(p.category==='chair'&&!equipmentSelected.includes('chair'))return false;for(const x of ['chair','mat','wall','blocks','strap','bolster','blanket'])if(new RegExp('\\b'+x+'\\b').test(e)&&!equipmentSelected.includes(x)&&!e.includes('optional'))return false;return true}
function phaseOf(p,style){let n=p.name.toLowerCase();if(/breath|centering|mountain|shoulder roll|neck/.test(n))return 0;if(/warm|cat|cow|mobil|ankle|wrist|pelvic|march/.test(n))return 1;if(/balance|warrior|lunge|tree|plank|standing|chair pose/.test(n))return 3;if(/relax|savasana|rest|meditat|body scan/.test(n)||p.category==='relaxation')return 5;if(/stretch|fold|twist|reclined|supported|child/.test(n))return 4;return 2}
function generate(){
 let style=draft.style,focus=draft.focus;
 let pool=state.poses.filter(p=>!p.sunType&&styleCompatible(p,style)&&equipmentCompatible(p));
 if(draft.level==='Beginner'||draft.level==='Mixed ability'||/chair|gentle|older adults|restorative|beginners/i.test(style))pool=pool.filter(p=>p.level==='Beginner'||p.category==='breath'||p.category==='relaxation');
 if(!pool.length)return toast('No compatible poses: adjust equipment, level or style');
 const isChair=/chair yoga|older adults/i.test(style),cap=maxExercise();
 let ranked=pool.map(p=>({p,phase:phaseOf(p,style),score:((p.focus||[]).includes(focus)?9:0)+(draft.goal!=='all'&&(GOAL_AREAS[draft.goal]||[]).some(a=>areaMatch(p,a))?6:0)+(p.videoChecked?2:0)}));
 ranked.sort((a,b)=>a.phase-b.phase||b.score-a.score||a.p.name.localeCompare(b.p.name));
 let sun=null,sunMinutes=0;
 if(draft.includeSun&&draft.duration>=25){let options=[...SUN_SALS.map((_,i)=>sunPose(i)),...state.customSuns].filter(p=>sunAllowed(p,style)&&equipmentCompatible(p));sun=options.find(p=>isChair?p.sunType==='chair':/vinyasa/i.test(style)?p.sunType==='vinyasa':p.sunType==='gentle')||options[0];if(sun)sunMinutes=Math.min(12,Math.max(4,Math.round(draft.duration*.18)))}
 let regular=draft.duration-sunMinutes,count=Math.max(2,Math.ceil(regular/cap)),chosen=[];
 let phases=[0,1,2,3,4,5],targets=[.09,.16,.23,.25,.16,.11];
 for(let j=0;j<phases.length;j++){let candidates=ranked.filter(x=>x.phase===phases[j]);let want=Math.max(j===0||j===5?1:0,Math.round(count*targets[j]));for(let x of candidates.slice(0,want))if(!chosen.includes(x.p))chosen.push(x.p)}
 for(let x of ranked)if(chosen.length<count&&!chosen.includes(x.p))chosen.push(x.p);
 chosen.sort((a,b)=>phaseOf(a,style)-phaseOf(b,style));
 if(chosen.length===0)return toast('No suitable exercises found');
 while(chosen.length*cap<regular){let reusable=chosen.filter(p=>phaseOf(p,style)>0&&phaseOf(p,style)<5);if(!reusable.length)break;chosen.splice(Math.max(1,chosen.length-1),0,reusable[(chosen.length)%reusable.length]);}
 let minutes=chosen.map(()=>1),remaining=regular-chosen.length;while(remaining>0){let changed=false;for(let j=0;j<minutes.length&&remaining>0;j++){if(minutes[j]<cap){minutes[j]++;remaining--;changed=true}}if(!changed)break}
 let names=['Arrival & breath','Warm-up','Preparation','Main sequence','Cool-down','Relaxation'];
 draft.items=chosen.map((p,i)=>({id:p.id,minutes:minutes[i],section:names[phaseOf(p,style)],techniqueLink:techniqueLink(p,style)}));
 if(sun)draft.items.splice(Math.min(3,draft.items.length-1),0,{id:sun.id,minutes:sunMinutes,rounds:2,section:'Sun salutations',techniqueLink:sun.link});
 render();toast('Structured '+style+' class generated — review sequencing and suitability');
}
function setMinutes(i,n){let p=pose(draft.items[i].id),cap=p?.sunType?180:maxExercise();draft.items[i].minutes=Math.max(1,Math.min(cap,+n||1));render()}function move(i,d){let j=i+d;if(j<0||j>=draft.items.length)return;[draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]];render()}function removeItem(i){draft.items.splice(i,1);render()}function addPose(id){draft.items.push({id,minutes:Math.min(maxExercise(),pose(id)?.minutes||3),section:'Manual addition'});toast('Added to current class');render()}function fresh(){if(draft.items.length&&!confirm('Start a new class and clear the current draft?'))return;draft={name:'New Yoga Class',includeSun:false,style:'Chair Yoga',focus:'Full-body mobility',level:'Beginner',goal:'all',duration:45,maxExerciseMinutes:5,items:[],notes:''};render()}
function saveClass(){if(!draft.items.length)return toast('Add some exercises first');let c={...structuredClone(draft),id:'c'+Date.now(),created:new Date().toISOString()};state.classes.push(c);save();toast('Class saved');render()}

const AREAS=['all','Neck','Shoulders','Upper back','Lower back','Chest','Core','Hips','Glutes','Hamstrings','Quadriceps','Knees','Calves','Ankles','Wrists','Full body'];
const GOALS=['all','Running','Cycling','Football','Golf','Swimming','Tennis','Dancing','Hiking','Strength training','Recovery / gentle mobility','Back discomfort','Neck discomfort','Shoulder discomfort','Knee discomfort','Hip discomfort','Wrist discomfort'];
const AREA_MAP={'Neck':['neck'],'Shoulders':['shoulder','arm','chest','eagle'],'Upper back':['back','spine','thoracic','twist','shoulder'],'Lower back':['back','spine','pelvic','cat','child'],'Chest':['chest','cobra','fish','camel'],'Core':['core','plank','boat','dead bug','balance'],'Hips':['hip','lunge','pigeon','figure four','butterfly'],'Glutes':['glute','bridge','chair','warrior'],'Hamstrings':['hamstring','forward fold','pyramid','leg'],'Quadriceps':['quad','lunge','warrior','chair'],'Knees':['knee','leg','balance'],'Calves':['calf','heel','ankle','dog'],'Ankles':['ankle','heel','toe','balance'],'Wrists':['wrist','finger','hand'],'Full body':['mobility','sun salutation','mountain']};
const GOAL_AREAS={'Running':['Hips','Hamstrings','Calves','Ankles'],'Cycling':['Hips','Quadriceps','Upper back'],'Football':['Hips','Hamstrings','Ankles'],'Golf':['Upper back','Hips','Shoulders'],'Swimming':['Shoulders','Upper back','Chest'],'Tennis':['Shoulders','Hips','Wrists'],'Dancing':['Hips','Ankles','Balance'],'Hiking':['Calves','Hips','Ankles'],'Strength training':['Shoulders','Hips','Upper back'],'Recovery / gentle mobility':['Full body','Upper back'],'Back discomfort':['Lower back','Upper back'],'Neck discomfort':['Neck','Shoulders'],'Shoulder discomfort':['Shoulders','Upper back'],'Knee discomfort':['Hips','Quadriceps'],'Hip discomfort':['Hips','Glutes'],'Wrist discomfort':['Wrists','Shoulders']};
function areaMatch(p,a){if(a==='all')return true;let hay=(p.name+' '+p.focus.join(' ')+' '+p.benefits).toLowerCase();return (AREA_MAP[a]||[]).some(t=>hay.includes(t));}
function filteredPoses(){return state.poses.filter(p=>(p.name+' '+p.sanskrit+' '+p.focus.join(' ')+' '+p.benefits).toLowerCase().includes(search.toLowerCase())&&(cat==='all'||p.category===cat)&&areaMatch(p,area)&&(goal==='all'||(GOAL_AREAS[goal]||[]).some(a=>areaMatch(p,a))))}
function goalNotice(){return goal.toLowerCase().includes('discomfort')?'<p class="note small">For discomfort or injuries, these are general gentle-movement ideas, not treatment or rehabilitation prescriptions. Check suitability with an appropriate clinician and adapt for the individual.</p>':''}
function library(){let list=filteredPoses();return `<div class="panel"><div class="row between"><h2>Exercise Library (${state.poses.length})</h2>${btn('+ Add / research exercise','newPoseForm()','primary')}</div><div class="grid"><div><label>Search exercise</label><input value="${esc(search)}" placeholder="Pose, movement or focus" oninput="search=this.value;updateLibrary()"></div><div><label>Category</label><select onchange="cat=this.value;updateLibrary()">${['all','chair','standing','seated','floor','breath','relaxation'].map(x=>`<option value="${x}" ${cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Body area</label><select onchange="area=this.value;updateLibrary()">${AREAS.map(x=>`<option ${area===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Sport or comfort focus</label><select onchange="goal=this.value;updateLibrary()">${GOALS.map(x=>`<option ${goal===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${goalNotice()}<p class="small muted">Open each technique link and mark it checked only after confirming the exact exercise and class variation. Suggested matches are approximate and should be reviewed. New expanded-library entries have technique research links and require instructor verification.</p><div id="poseList">${poseList(list)}</div></div>`}
function updateLibrary(){let el=$('poseList');if(el)el.innerHTML=goalNotice()+poseList(filteredPoses())}
function poseList(list){return `<p class="small muted">${list.length} matching exercises</p>${list.map(p=>`<details><summary>${esc(p.name)} <span class="muted small">${esc(sanskritName(p)||'English / descriptive name')} · ${p.category} · ${p.minutes} min</span></summary><p>${p.focus.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><p><b>Technique:</b> ${esc(p.instructions)}</p><p><b>Adaptations:</b> ${esc(p.modifications)}</p><p><b>Benefits:</b> ${esc(p.benefits)}</p><p><b>Equipment:</b> ${esc(p.equipment)} · <b>Level:</b> ${esc(p.level)}</p><p><b>Safety:</b> ${esc(p.cautions||'Use appropriate modifications.')}</p><div class="actions"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">${p.videoChecked?'✓ Instructor-checked link ↗':'Technique source / search ↗'}</a>${btn(p.videoChecked?'Unmark checked':'Mark link checked',`toggleChecked('${p.id}')`)}${btn('Add to class',`addPose('${p.id}')`,'primary')}${btn('Edit',`editPose('${p.id}')`)}</div></details>`).join('')}`}
function toggleChecked(id){let p=pose(id);if(!p)return;if(!p.videoChecked&&!confirm('Have you opened this link and confirmed that it demonstrates the exact named exercise and correct class variation?'))return;p.videoChecked=!p.videoChecked;save();render()}
function newPoseForm(existing){let p=existing||{id:'u'+Date.now(),name:'',sanskrit:'',category:'chair',level:'Beginner',focus:['Full-body mobility'],instructions:'',modifications:'',benefits:'',equipment:'none',minutes:3,cautions:'',link:''};$('app').innerHTML=`<div class="panel"><h2>${existing?'Edit exercise':'Add / research exercise'}</h2><p class="muted">Enter a pose name and open the online research links. Review the information, then save your own entry. Browser-only apps cannot reliably extract full web pages automatically.</p><label>Exercise name</label><input id="pname" value="${esc(p.name)}"><div class="actions" style="margin-top:10px">${btn('Auto-fill from Wikipedia','autoFillPose()','primary')}${btn('Search the web','researchWeb()')}${btn('Search technique videos','researchVideo()')}</div><div class="grid"><div><label>Sanskrit / alternative name</label><input id="psanskrit" value="${esc(p.sanskrit)}"><label>Category</label><select id="pcategory">${['chair','standing','seated','floor','breath','relaxation'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select><label>Level</label><select id="plevel">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${p.level===x?'selected':''}>${x}</option>`).join('')}</select><label>Suggested minutes</label><input id="pminutes" type="number" min="1" max="60" value="${p.minutes}"></div><div><label>Focus (comma separated)</label><input id="pfocus" value="${esc(p.focus.join(', '))}"><label>Equipment</label><input id="pequipment" value="${esc(p.equipment)}"><label>Benefits</label><textarea id="pbenefits" rows="2">${esc(p.benefits)}</textarea><label>Technique URL</label><input id="plink" value="${esc(p.link)}"></div></div><label>Instructions</label><textarea id="pinstructions" rows="3">${esc(p.instructions)}</textarea><label>Modifications / alternatives</label><textarea id="pmodifications" rows="2">${esc(p.modifications)}</textarea><label>Safety considerations</label><textarea id="pcautions" rows="2">${esc(p.cautions)}</textarea><div class="actions" style="margin-top:12px">${btn('Save exercise',`commitPose('${p.id}')`,'primary')}${btn('Cancel',"go('Exercise Library')")}</div></div>`}
async function autoFillPose(){let name=$('pname').value.trim();if(!name)return toast('Enter a pose name');try{let url='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(name+' yoga asana')+'&gsrlimit=1&prop=extracts|info&exintro=1&explaintext=1&inprop=url&format=json&origin=*';let res=await fetch(url);if(!res.ok)throw Error('Search unavailable');let j=await res.json(),item=Object.values(j.query?.pages||{})[0];if(!item||!item.extract)throw Error('No reliable matching article found');if(!confirm('Found: '+item.title+'\n\nReview and use this summary as a starting point?'))return;$('pbenefits').value=(item.extract||'').slice(0,850);$('pinstructions').value='Research summary (not verified technique): '+(item.extract||'').slice(0,900);$('plink').value=item.fullurl||'';toast('Research imported — check accuracy and complete technique fields')}catch(e){toast(e.message+' — use Search the web instead')}}
function researchWeb(){let s=$('pname').value.trim();if(!s)return toast('Enter a pose name');window.open('https://www.google.com/search?q='+encodeURIComponent(s+' yoga pose instructions modifications contraindications'),'_blank','noopener')}
function researchVideo(){let s=$('pname').value.trim();if(!s)return toast('Enter a pose name');window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s+' yoga technique'),'_blank','noopener')}
function editPose(id){newPoseForm(pose(id))}function commitPose(id){let name=$('pname').value.trim();if(!name)return toast('Exercise name required');let p={id,name,sanskrit:$('psanskrit').value,category:$('pcategory').value,level:$('plevel').value,focus:$('pfocus').value.split(',').map(x=>x.trim()).filter(Boolean),equipment:$('pequipment').value,benefits:$('pbenefits').value,minutes:Math.max(1,+$('pminutes').value||3),videoChecked:pose(id)?.videoChecked||false,link:$('plink').value.trim()||'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' yoga technique'),instructions:$('pinstructions').value,modifications:$('pmodifications').value,cautions:$('pcautions').value};if(!/^https?:\/\//i.test(p.link))return toast('Technique link must begin with https://');let i=state.poses.findIndex(x=>x.id===id);if(i<0)state.poses.push(p);else state.poses[i]=p;save();go('Exercise Library');toast('Exercise saved')}
function saved(){return `<div class="panel"><h2>Saved classes</h2>${state.classes.length?state.classes.map(c=>`<details><summary>${esc(c.name)} <span class="muted small">${esc(c.style)} · ${c.duration} min · ${c.items.length} activities</span></summary><p class="muted small">${esc(c.focus)} · ${esc(c.level)}</p><div class="actions">${btn('Load / edit',`loadClass('${c.id}')`,'primary')}${btn('Print',`printSaved('${c.id}')`)}${btn('Schedule',`scheduleClass('${c.id}')`)}${btn('Duplicate',`duplicateClass('${c.id}')`)}${btn('📲 Client mini app',`exportClientApp('${c.id}')`,'primary')}${btn('Delete',`deleteClass('${c.id}')`,'danger')}</div></details>`).join(''):'<p>No saved classes yet. Build one in Class Planner.</p>'}</div>`}
function loadClass(id){let c=state.classes.find(x=>x.id===id);if(!c)return;draft=structuredClone(c);delete draft.id;delete draft.created;go('Class Planner')}
function duplicateClass(id){let c=state.classes.find(x=>x.id===id);state.classes.push({...structuredClone(c),id:'c'+Date.now(),name:c.name+' (copy)'});save();render()}
function deleteClass(id){if(!confirm('Delete this saved class?'))return;state.classes=state.classes.filter(c=>c.id!==id);state.events=state.events.filter(e=>e.classId!==id);save();render()}
function scheduleClass(id){let date=prompt('Enter class date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!date)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))return toast('Enter a valid date');let time=prompt('Start time (HH:MM)','10:00')||'10:00';state.events.push({id:'e'+Date.now(),classId:id,date,time});save();toast('Class scheduled');go('Calendar')}
function coursesPage(){return `<div class="panel"><h2>Multiweek programmes</h2><p class="muted">Create a progressive course from saved classes. Review and adapt each week for your participants.</p><div class="grid"><div><label>Course name</label><input id="courseName" placeholder="Six weeks of gentle yoga"></div><div><label>Weeks</label><select id="courseWeeks">${[4,6,8,10,12].map(n=>`<option ${n===6?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Base class</label><select id="courseBase">${state.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div></div>${btn('Create course','createCourse()','primary')}</div><div class="panel"><h3>Saved courses</h3>${state.courses.map(c=>`<details><summary>${esc(c.name)} · ${c.weeks.length} weeks</summary>${c.weeks.map((w,i)=>`<div class="course-card"><b>Week ${i+1} — ${esc(w.focus)}</b><p class="small muted">${esc(w.notes||'Adapt as appropriate to participants')}</p>${btn('Load week',`loadCourseWeek('${c.id}',${i})`)}${btn('Edit focus',`editCourseWeek('${c.id}',${i})`)}</div>`).join('')}${btn('Delete course',`deleteCourse('${c.id}')`,'danger')}</details>`).join('')||'<p>No courses yet. Save a class first, then build a course.</p>'}</div>`}
function createCourse(){let base=state.classes.find(c=>c.id===$('courseBase')?.value),name=$('courseName')?.value.trim(),n=+$('courseWeeks')?.value;if(!base||!name)return toast('Save a base class and enter a course name');let themes=['Foundations & breath','Gentle mobility','Balance & stability','Posture & alignment','Strength & control','Flexibility & ease','Flow & coordination','Relaxation & recovery','Consolidation','Personal practice','Mindful movement','Review & reflection'];state.courses.push({id:'course'+Date.now(),name,weeks:Array.from({length:n},(_,i)=>({focus:themes[i%themes.length],notes:'Adjust range, transitions and support to participants.',classData:structuredClone(base)}))});save();render();toast('Course created')}
function loadCourseWeek(id,i){let c=state.courses.find(c=>c.id===id),w=c?.weeks[i];if(!w)return;draft=structuredClone(w.classData);delete draft.id;draft.name=c.name+' — Week '+(i+1);draft.focus=w.focus;go('Class Planner')}
function editCourseWeek(id,i){let w=state.courses.find(c=>c.id===id)?.weeks[i];if(!w)return;let f=prompt('Weekly focus',w.focus);if(f===null)return;w.focus=f;let n=prompt('Instructor notes',w.notes||'');if(n!==null)w.notes=n;save();render()}

function calendar(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array(offset).fill(null).concat(Array.from({length:days},(_,i)=>i+1));return `<div class="panel"><div class="row between"><h2>Class calendar</h2><div class="actions">${btn('←','changeMonth(-1)')}<strong>${first.toLocaleString('en-GB',{month:'long',year:'numeric'})}</strong>${btn('→','changeMonth(1)')}</div></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="small muted" style="text-align:center">${d}</div>`).join('')}${cells.map(d=>{if(!d)return '<div></div>';let date=month+'-'+String(d).padStart(2,'0'),ev=state.events.filter(e=>e.date===date);return `<button class="day ${ev.length?'has':''} ${date===new Date().toISOString().slice(0,10)?'today':''}" onclick="dayInfo('${date}')"><strong>${d}</strong>${ev.slice(0,2).map(e=>`<span class="dot">${esc(state.classes.find(c=>c.id===e.classId)?.name||'Class')}</span>`).join('')}${ev.length>2?`<span class="dot">+${ev.length-2} more</span>`:''}</button>`}).join('')}</div><p class="small muted">Schedule classes from the Saved Classes tab. Select a day to view or remove scheduled classes.</p></div>`}

function exportClientApp(id){

" class="secondary">Next ▶</button></div><p style="font-size:.85rem;color:#55706d">Turn on Auto-rotate on your device to use landscape. The timer works offline while this page remains open.</p></main><script>const data=${payload};let i=0,left=data.activities[0].seconds,running=false,last=0;const $=id=>document.getElementById(id);function fmt(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function render(){const a=data.activities[i];$('classTitle').textContent=data.name+' · '+data.style;$('position').textContent='Exercise '+(i+1)+' of '+data.activities.length;$('name').textContent=a.name;$('sanskrit').textContent=a.sanskrit||'';$('cue').textContent=a.instructions;$('time').textContent=fmt(left);$('next').textContent='Next: '+(data.activities[i+1]?.name||'Class complete');$('progress').value=(i/data.activities.length)*100;$('play').textContent=running?'Pause':'Start';$('stepsBox').hidden=!a.steps.length;$('steps').replaceChildren(...a.steps.map(t=>{let li=document.createElement('li');li.textContent=t;return li}));}function step(d){i=Math.max(0,Math.min(data.activities.length-1,i+d));left=data.activities[i].seconds;running=false;render()}$('prev').onclick=()=>step(-1);$('skip').onclick=()=>step(1);$('reset').onclick=()=>{running=false;left=data.activities[i].seconds;render()};$('play').onclick=()=>{running=!running;last=performance.now();render()};function tick(now){if(running){left-=Math.max(0,(now-last)/1000);if(left<=0){left=0;running=false;if(navigator.vibrate)navigator.vibrate(180)}$('time').textContent=fmt(left);$('play').textContent=running?'Pause':'Start'}last=now;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;render()}});<\/script></body></html>`;
