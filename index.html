 {test:/yin yoga/i,cats:['floor','seated','breath','relaxation'],terms:'yin yoga long hold demonstration'},
 {test:/vinyasa/i,cats:['standing','floor','breath','relaxation'],terms:'vinyasa yoga flow demonstration'},

 {test:/gentle|beginners|mobility|older adults/i,cats:['standing','seated','floor','breath','relaxation'],terms:'gentle beginner yoga demonstration'},

const sunId=i=>'sun'+i;
function sunPose(i){let a=SUN_SALS[i];return {id:sunId(i),name:a[0],sanskrit:'',category:a[2],level:/standard|strength/i.test(a[0])?'Intermediate':'Beginner',focus:['Full-body mobility'],equipment:a[2]==='chair'?'chair':a[1]==='wall'?'wall':'mat',minutes:6,benefits:'Linked yoga sequence',instructions:'Complete sequence (repeat at a comfortable pace): '+a[3].map((x,j)=>(j+1)+'. '+x).join(' → '),modifications:'Move slowly; omit or modify any uncomfortable movement. Repeat both sides where relevant.',cautions:'Adapt transitions, wrist loading, balance and range to participants; not an injury treatment.',link:'https://www.youtube.com/results?search_query='+encodeURIComponent(a[0]+' yoga demonstration'),sunType:a[1],steps:a[3]}}
for(let i=0;i<SUN_SALS.length;i++){let q=sunPose(i);if(!state.poses.some(p=>p.id===q.id))state.poses.push(q)}
function sunAllowed(p,style){if(!p.sunType)return false;let t=style.toLowerCase();if(/chair|older adults/.test(t))return p.sunType==='chair';if(/restorative|yin/.test(t))return p.sunType==='restorative'||p.sunType==='gentle'&&p.category==='floor';if(/vinyasa/.test(t))return ['vinyasa','gentle','traditional'].includes(p.sunType)&&p.category==='standing';if(/runner|cyclist|golfer|swimmer|football/.test(t))return p.sunType==='sport'||p.sunType==='gentle';if(/gentle|beginner/.test(t))return ['gentle','chair','wall','hatha'].includes(p.sunType);return p.sunType!=='chair'||/chair/.test(t)}
function sunSalsPanel(){return `<div class="panel no-print"><h3>☀️ Sun salutations / Sun Sals</h3><p class="small muted">${SUN_SALS.length} full sequences. Add one as a timed block, then expand it for step-by-step movements. The technique links are targeted research searches until a specific demonstration is checked.</p><div class="grid"><div><label>Choose sequence</label><select id="sunChoice" onchange="sunPreview()">${SUN_SALS.map((a,i)=>`<option value="${i}" ${sunAllowed(sunPose(i),draft.style)?'':'disabled'}>${esc(a[0])}${sunAllowed(sunPose(i),draft.style)?'':' (not suited to selected style)'}</option>`).join('')}</select></div><div><label>Block duration (minutes)</label><input id="sunMinutes" type="number" min="2" max="45" value="6"></div><div><label>Rounds</label><input id="sunRounds" type="number" min="1" max="12" value="2"></div></div><div id="sunPreview" class="note small" style="margin:10px 0"></div><div class="actions">${btn('Add sun sal to class','addSunSal()','primary')}${btn('Browse all sun sals',"go('Sun Salutations')")}</div></div>`}

function generate(){
 let style=draft.style,focus=draft.focus,rule=classRule(style);
 let pool=state.poses.filter(p=>!p.sunType&&styleCompatible(p,style));
 if(draft.level==='Beginner'||draft.level==='Mixed ability'||/chair|gentle|older adults|restorative|beginners/i.test(style))pool=pool.filter(p=>p.level==='Beginner'||p.category==='breath'||p.category==='relaxation');
 if(!pool.length)return toast('No compatible exercises found for this class style');
 const isChair=/chair yoga|older adults/i.test(style),isRest=/restorative|yin|stretch & relax/i.test(style);
 let starters=pool.filter(p=>isChair?/mountain|breath|shoulder roll/i.test(p.name):/breath|mountain|centering|easy seated/i.test(p.name));
 let finishers=pool.filter(p=>isChair?/relaxation|breath/i.test(p.name):/savasana|relaxation|meditation|rest/i.test(p.name));
 let intro=starters[0]||pool[0],end=finishers.find(p=>p.id!==intro.id)||pool.find(p=>p.id!==intro.id&&/relax|rest/i.test(p.name))||pool.at(-1);
 let middle=pool.filter(p=>p.id!==intro.id&&p.id!==end.id).map(p=>({p,score:(p.focus||[]).includes(focus)?8:0})).map(o=>({p:o.p,score:o.score+(draft.goal!=='all'&&(GOAL_AREAS[draft.goal]||[]).some(a=>areaMatch(o.p,a))?5:0)+(o.p.level==='Beginner'?2:0)+(isRest&&/supported|reclined|rest/i.test(o.p.name)?4:0)+Math.random()})).sort((a,b)=>b.score-a.score).map(x=>x.p);
 let count=Math.max(2,Math.min(middle.length,Math.min(16,Math.round(draft.duration/4)-2)));
 let selected=middle.slice(0,count);if(!selected.length)return toast('Not enough compatible poses');
 let all=[intro,...selected,end];let mins=all.map((p,i)=>i===0?Math.max(2,Math.round(draft.duration*.1)):i===all.length-1?Math.max(3,Math.round(draft.duration*.14)):1);
 let remain=draft.duration-mins.reduce((a,b)=>a+b,0);for(let j=0;remain>0;j=(j+1)%selected.length){mins[j+1]++;remain--}while(remain<0){let i=mins.findIndex((m,k)=>k>0&&k<mins.length-1&&m>1);if(i<0)break;mins[i]--;remain++}
 draft.items=all.map((p,i)=>({id:p.id,minutes:mins[i],section:i===0?'Arrival & breath':i===all.length-1?'Cool-down & relaxation':i<3?'Warm-up':'Main sequence',techniqueLink:techniqueLink(p,style)}));if(draft.includeSun&&draft.duration>=25){let choices=SUN_SALS.map((a,i)=>sunPose(i)).filter(p=>sunAllowed(p,style));let match=choices.find(p=>/chair/.test(style.toLowerCase())?p.sunType==='chair':/vinyasa/.test(style.toLowerCase())?p.sunType==='vinyasa':/restorative|yin/.test(style.toLowerCase())?p.sunType==='restorative':p.sunType==='gentle')||choices[0];if(match){let min=Math.min(8,Math.max(4,Math.round(draft.duration*.15)));let donor=draft.items.slice(1,-1);for(let j=0;j<min;j++){let d=donor.filter(x=>x.minutes>1).sort((a,b)=>b.minutes-a.minutes)[0];if(d)d.minutes--;}let actual=draft.duration-draft.items.reduce((a,x)=>a+x.minutes,0);if(actual>0)draft.items.splice(2,0,{id:match.id,minutes:actual,rounds:2,section:'Sun salutations',techniqueLink:match.link})}}render();toast('Generated '+style+' class with style-matched technique searches');
}
function setMinutes(i,n){draft.items[i].minutes=Math.max(1,+n||1);render()}function move(i,d){let j=i+d;if(j<0||j>=draft.items.length)return;[draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]];render()}function removeItem(i){draft.items.splice(i,1);render()}function addPose(id){draft.items.push({id,minutes:pose(id)?.minutes||3,section:'Manual addition'});toast('Added to current class');render()}function fresh(){if(draft.items.length&&!confirm('Start a new class and clear the current draft?'))return;draft={name:'New Yoga Class',includeSun:false,style:'Chair Yoga',focus:'Full-body mobility',level:'Beginner',goal:'all',duration:45,items:[],notes:''};render()}
function saveClass(){if(!draft.items.length)return toast('Add some exercises first');let c={...structuredClone(draft),id:'c'+Date.now(),created:new Date().toISOString()};state.classes.push(c);save();toast('Class saved');render()}

function areaMatch(p,a){if(a==='all')return true;let hay=(p.name+' '+p.focus.join(' ')+' '+p.benefits).toLowerCase();return (AREA_MAP[a]||[]).some(t=>hay.includes(t));}
function filteredPoses(){return state.poses.filter(p=>(p.name+' '+p.sanskrit+' '+p.focus.join(' ')+' '+p.benefits).toLowerCase().includes(search.toLowerCase())&&(cat==='all'||p.category===cat)&&areaMatch(p,area)&&(goal==='all'||(GOAL_AREAS[goal]||[]).some(a=>areaMatch(p,a))))}
function goalNotice(){return goal.toLowerCase().includes('discomfort')?'<p class="note small">For discomfort or injuries, these are general gentle-movement ideas, not treatment or rehabilitation prescriptions. Check suitability with an appropriate clinician and adapt for the individual.</p>':''}
function library(){let list=filteredPoses();return `<div class="panel"><div class="row between"><h2>Exercise Library (${state.poses.length})</h2>${btn('+ Add / research exercise','newPoseForm()','primary')}</div><div class="grid"><div><label>Search exercise</label><input value="${esc(search)}" placeholder="Pose, movement or focus" oninput="search=this.value;updateLibrary()"></div><div><label>Category</label><select onchange="cat=this.value;updateLibrary()">${['all','chair','standing','seated','floor','breath','relaxation'].map(x=>`<option value="${x}" ${cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Body area</label><select onchange="area=this.value;updateLibrary()">${AREAS.map(x=>`<option ${area===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Sport or comfort focus</label><select onchange="goal=this.value;updateLibrary()">${GOALS.map(x=>`<option ${goal===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${goalNotice()}<p class="small muted">Open each technique link and mark it checked only after confirming the exact exercise and class variation. Suggested matches are approximate and should be reviewed. New expanded-library entries have technique research links and require instructor verification.</p><div id="poseList">${poseList(list)}</div></div>`}
function updateLibrary(){let el=$('poseList');if(el)el.innerHTML=goalNotice()+poseList(filteredPoses())}
function poseList(list){return `<p class="small muted">${list.length} matching exercises</p>${list.map(p=>`<details><summary>${esc(p.name)} <span class="muted small">${esc(p.sanskrit||'')} · ${p.category} · ${p.minutes} min</span></summary><p>${p.focus.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><p><b>Technique:</b> ${esc(p.instructions)}</p><p><b>Adaptations:</b> ${esc(p.modifications)}</p><p><b>Benefits:</b> ${esc(p.benefits)}</p><p><b>Equipment:</b> ${esc(p.equipment)} · <b>Level:</b> ${esc(p.level)}</p><p><b>Safety:</b> ${esc(p.cautions||'Use appropriate modifications.')}</p><div class="actions"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">${p.videoChecked?'✓ Instructor-checked link ↗':'Technique source / search ↗'}</a>${btn(p.videoChecked?'Unmark checked':'Mark link checked',`toggleChecked('${p.id}')`)}${btn('Add to class',`addPose('${p.id}')`,'primary')}${btn('Edit',`editPose('${p.id}')`)}</div></details>`).join('')}`}
function toggleChecked(id){let p=pose(id);if(!p)return;if(!p.videoChecked&&!confirm('Have you opened this link and confirmed that it demonstrates the exact named exercise and correct class variation?'))return;p.videoChecked=!p.videoChecked;save();render()}
function newPoseForm(existing){let p=existing||{id:'u'+Date.now(),name:'',sanskrit:'',category:'chair',level:'Beginner',focus:['Full-body mobility'],instructions:'',modifications:'',benefits:'',equipment:'none',minutes:3,cautions:'',link:''};$('app').innerHTML=`<div class="panel"><h2>${existing?'Edit exercise':'Add / research exercise'}</h2><p class="muted">Enter a pose name and open the online research links. Review the information, then save your own entry. Browser-only apps cannot reliably extract full web pages automatically.</p><label>Exercise name</label><input id="pname" value="${esc(p.name)}"><div class="actions" style="margin-top:10px">${btn('Auto-fill from Wikipedia','autoFillPose()','primary')}${btn('Search the web','researchWeb()')}${btn('Search technique videos','researchVideo()')}</div><div class="grid"><div><label>Sanskrit / alternative name</label><input id="psanskrit" value="${esc(p.sanskrit)}"><label>Category</label><select id="pcategory">${['chair','standing','seated','floor','breath','relaxation'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select><label>Level</label><select id="plevel">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${p.level===x?'selected':''}>${x}</option>`).join('')}</select><label>Suggested minutes</label><input id="pminutes" type="number" min="1" max="60" value="${p.minutes}"></div><div><label>Focus (comma separated)</label><input id="pfocus" value="${esc(p.focus.join(', '))}"><label>Equipment</label><input id="pequipment" value="${esc(p.equipment)}"><label>Benefits</label><textarea id="pbenefits" rows="2">${esc(p.benefits)}</textarea><label>Technique URL</label><input id="plink" value="${esc(p.link)}"></div></div><label>Instructions</label><textarea id="pinstructions" rows="3">${esc(p.instructions)}</textarea><label>Modifications / alternatives</label><textarea id="pmodifications" rows="2">${esc(p.modifications)}</textarea><label>Safety considerations</label><textarea id="pcautions" rows="2">${esc(p.cautions)}</textarea><div class="actions" style="margin-top:12px">${btn('Save exercise',`commitPose('${p.id}')`,'primary')}${btn('Cancel',"go('Exercise Library')")}</div></div>`}
async function autoFillPose(){let name=$('pname').value.trim();if(!name)return toast('Enter a pose name');try{let url='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(name+' yoga asana')+'&gsrlimit=1&prop=extracts|info&exintro=1&explaintext=1&inprop=url&format=json&origin=*';let res=await fetch(url);if(!res.ok)throw Error('Search unavailable');let j=await res.json(),item=Object.values(j.query?.pages||{})[0];if(!item||!item.extract)throw Error('No reliable matching article found');if(!confirm('Found: '+item.title+'\n\nReview and use this summary as a starting point?'))return;$('pbenefits').value=(item.extract||'').slice(0,850);$('pinstructions').value='Research summary (not verified technique): '+(item.extract||'').slice(0,900);$('plink').value=item.fullurl||'';toast('Research imported — check accuracy and complete technique fields')}catch(e){toast(e.message+' — use Search the web instead')}}
function researchWeb(){let s=$('pname').value.trim();if(!s)return toast('Enter a pose name');window.open('https://www.google.com/search?q='+encodeURIComponent(s+' yoga pose instructions modifications contraindications'),'_blank','noopener')}
function researchVideo(){let s=$('pname').value.trim();if(!s)return toast('Enter a pose name');window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s+' yoga technique'),'_blank','noopener')}
function editPose(id){newPoseForm(pose(id))}function commitPose(id){let name=$('pname').value.trim();if(!name)return toast('Exercise name required');let p={id,name,sanskrit:$('psanskrit').value,category:$('pcategory').value,level:$('plevel').value,focus:$('pfocus').value.split(',').map(x=>x.trim()).filter(Boolean),equipment:$('pequipment').value,benefits:$('pbenefits').value,minutes:Math.max(1,+$('pminutes').value||3),videoChecked:pose(id)?.videoChecked||false,link:$('plink').value.trim()||'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' yoga technique'),instructions:$('pinstructions').value,modifications:$('pmodifications').value,cautions:$('pcautions').value};if(!/^https?:\/\//i.test(p.link))return toast('Technique link must begin with https://');let i=state.poses.findIndex(x=>x.id===id);if(i<0)state.poses.push(p);else state.poses[i]=p;save();go('Exercise Library');toast('Exercise saved')}
function saved(){return `<div class="panel"><h2>Saved classes</h2>${state.classes.length?state.classes.map(c=>`<details><summary>${esc(c.name)} <span class="muted small">${esc(c.style)} · ${c.duration} min · ${c.items.length} activities</span></summary><p class="muted small">${esc(c.focus)} · ${esc(c.level)}</p><div class="actions">${btn('Load / edit',`loadClass('${c.id}')`,'primary')}${btn('Print',`printSaved('${c.id}')`)}${btn('Schedule',`scheduleClass('${c.id}')`)}${btn('Duplicate',`duplicateClass('${c.id}')`)}${btn('Delete',`deleteClass('${c.id}')`,'danger')}</div></details>`).join(''):'<p>No saved classes yet. Build one in Class Planner.</p>'}</div>`}
function loadClass(id){let c=state.classes.find(x=>x.id===id);if(!c)return;draft=structuredClone(c);delete draft.id;delete draft.created;go('Class Planner')}
function duplicateClass(id){let c=state.classes.find(x=>x.id===id);state.classes.push({...structuredClone(c),id:'c'+Date.now(),name:c.name+' (copy)'});save();render()}
function deleteClass(id){if(!confirm('Delete this saved class?'))return;state.classes=state.classes.filter(c=>c.id!==id);state.events=state.events.filter(e=>e.classId!==id);save();render()}
function scheduleClass(id){let date=prompt('Enter class date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!date)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))return toast('Enter a valid date');let time=prompt('Start time (HH:MM)','10:00')||'10:00';state.events.push({id:'e'+Date.now(),classId:id,date,time});save();toast('Class scheduled');go('Calendar')}
function calendar(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array(offset).fill(null).concat(Array.from({length:days},(_,i)=>i+1));return `<div class="panel"><div class="row between"><h2>Class calendar</h2><div class="actions">${btn('←','changeMonth(-1)')}<strong>${first.toLocaleString('en-GB',{month:'long',year:'numeric'})}</strong>${btn('→','changeMonth(1)')}</div></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="small muted" style="text-align:center">${d}</div>`).join('')}${cells.map(d=>{if(!d)return '<div></div>';let date=month+'-'+String(d).padStart(2,'0'),ev=state.events.filter(e=>e.date===date);return `<button class="day ${ev.length?'has':''} ${date===new Date().toISOString().slice(0,10)?'today':''}" onclick="dayInfo('${date}')"><strong>${d}</strong>${ev.slice(0,2).map(e=>`<span class="dot">${esc(state.classes.find(c=>c.id===e.classId)?.name||'Class')}</span>`).join('')}${ev.length>2?`<span class="dot">+${ev.length-2} more</span>`:''}</button>`}).join('')}</div><p class="small muted">Schedule classes from the Saved Classes tab. Select a day to view or remove scheduled classes.</p></div>`}
function changeMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.toISOString().slice(0,7);render()}
function dayInfo(date){let ev=state.events.filter(e=>e.date===date);$('app').insertAdjacentHTML('beforeend',`<div class="panel" id="dayPanel"><h3>${date}</h3>${ev.length?ev.map(e=>`<p>${esc(e.time)} — ${esc(state.classes.find(c=>c.id===e.classId)?.name||'Deleted class')} ${btn('Remove',`removeEvent('${e.id}')`,'danger')}</p>`).join(''):'<p>No classes scheduled.</p>'}${btn('Close',"$('dayPanel').remove()")}</div>`);$('dayPanel').scrollIntoView({behavior:'smooth'})}function removeEvent(id){state.events=state.events.filter(e=>e.id!==id);save();render()}
function startDraftTimer(){activeClass=structuredClone(draft);timer=0;timerLeft=(activeClass.items[0]?.minutes||0)*60;timerRunning=false;go('Teaching Timer')}
function timerView(){let c=activeClass||draft;if(!c.items.length)return `<div class="panel"><h2>Teaching timer</h2><p>Build or load a class to use the timer.</p>${btn('Open planner',"go('Class Planner')")}</div>`;let it=c.items[Math.min(timer||0,c.items.length-1)],p=pose(it.id);return `<div class="panel"><h2>Teaching timer</h2><p class="muted">${esc(c.name)}</p><h3>${esc(p?.name||'Exercise')}</h3><p class="muted">Exercise ${(timer||0)+1} of ${c.items.length}</p><div class="stat" id="clock">${clock(timerLeft)}</div><div class="actions" style="margin:14px 0">${btn(timerRunning?'Pause':'Start',"toggleTimer()",'primary')}${btn('Reset current','resetTimer()')}${btn('Previous','stepTimer(-1)')}${btn('Next','stepTimer(1)')}</div><p>${esc(p?.instructions||'')}</p><p class="small muted">${esc(p?.modifications||'')}</p><div class="note small">Keep your screen awake while using this timer. It may pause when the browser is in the background.</div></div>`}
function clock(s){return String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0')}
function toggleTimer(){timerRunning=!timerRunning;render()}function resetTimer(){timerRunning=false;timerLeft=(activeClass?.items[timer]?.minutes||draft.items[timer]?.minutes||1)*60;render()}function stepTimer(d){let c=activeClass||draft;timer=Math.max(0,Math.min(c.items.length-1,(timer||0)+d));timerLeft=c.items[timer].minutes*60;timerRunning=false;render()}
setInterval(()=>{if(!timerRunning)return;if(timerLeft>0)timerLeft--;if($('clock'))$('clock').textContent=clock(timerLeft);if(timerLeft===0){timerRunning=false;toast('Time for the next pose');render()}},1000);
function settings(){return `<div class="panel"><h2>Settings & backup</h2><h3>Class styles</h3><p class="small muted">Add your own yoga class style.</p><div class="row"><input class="grow" id="newstyle" placeholder="New style"><button onclick="addStyle()">Add style</button></div><p>${state.styles.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</p><h3>Backup your data</h3><div class="actions">${btn('Export backup JSON','exportData()','primary')}<label class="btn" style="margin:0">Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div><p class="small muted">Export includes your exercises, saved classes and calendar. Import replaces the current data after confirmation.</p><h3>Install & offline use</h3><p class="small">Open this app from an HTTPS website, then use your browser menu → Add to Home screen / Install app. Previously visited pages and saved plans can work offline.</p><p class="note small">Exercise information is for instructor planning and must be checked for accuracy and individual suitability. Internet research links do not automatically import copyrighted web content.</p></div>`}
function addStyle(){let s=$('newstyle').value.trim();if(!s)return;if(!state.styles.includes(s))state.styles.push(s);save();render()}
function exportData(){let b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yoga-planner-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.poses)||!Array.isArray(x.classes)||!Array.isArray(x.events))throw Error('Invalid backup');if(!confirm('Replace all current yoga planner data with this backup?'))return;state={poses:x.poses,classes:x.classes,events:x.events,styles:Array.isArray(x.styles)?x.styles:STYLES,notes:x.notes||''};save();render();toast('Backup restored')}catch(e){toast('Could not import backup: '+e.message)}}
function printDraft(){printClass(draft)}function printSaved(id){let c=state.classes.find(x=>x.id===id);if(c)printClass(c)}
function printClass(c){let w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');let rows=c.items.map((it,i)=>{let p=pose(it.id),start=c.items.slice(0,i).reduce((a,x)=>a+(+x.minutes||0),0);return `<tr><td>${start}–${start+(+it.minutes||0)} min</td><td>${esc(p?.name||'Unknown pose')}</td>${printMode!=='cheat'?`<td>${esc(p?.instructions||'')}${printMode==='full'?`<br><small>${esc(p?.modifications||'')}</small>`:''}</td>`:''}</tr>`}).join('');let html=`<!doctype html><html><head><title>${esc(c.name)}</title><style>body{font:13px Arial;padding:20px;color:#222}h1{margin-bottom:5px}p{color:#555}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ccc;text-align:left;vertical-align:top}th{background:#edf2ef}@page{size:A4;margin:14mm}</style></head><body><h1>${esc(c.name)}</h1><p>${esc(c.style)} · ${esc(c.focus)} · ${esc(c.level)} · ${c.duration} minutes</p><table><thead><tr><th>Time</th><th>Pose / activity</th>${printMode!=='cheat'?'<th>Instructor cues</th>':''}</tr></thead><tbody>${rows}</tbody></table>${printMode!=='cheat'&&c.notes?`<p><b>Notes:</b> ${esc(c.notes)}</p>`:''}<script>window.onload=()=>window.print()<\/script></body></html>`;w.document.write(html);w.document.close()}
function choosePrint(){let x=prompt('Print format: type cheat (names & times) or full (with instructions)','cheat');if(x===null)return;printMode=x.toLowerCase()==='full'?'full':'cheat';printDraft()}
// Make print button choose format by default.
const oldPrint=printDraft;printDraft=()=>{let choice=prompt('Print format: CHEAT for names and times, or FULL for teaching instructions','CHEAT');if(choice===null)return;printMode=choice.trim().toLowerCase()==='full'?'full':'cheat';printClass(draft)};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
